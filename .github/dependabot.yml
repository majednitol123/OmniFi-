version: 2
updates:
  # Maintain dependencies for GitHub Actions
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'

  # Maintain dependencies for npm / pnpm packages
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    groups:
      dependencies:
        patterns:
          - '*'

  # Maintain dependencies for Solana Cargo workspace
  - package-ecosystem: 'cargo'
    directory: '/chains/solana'
    schedule:
      interval: 'weekly'
    groups:
      dependencies:
        patterns:
          - '*'
