[workspace]
members = [
    "programs/placeholder",
    "programs/omnifi_amm",
    "programs/omnifi_clmm"
]
resolver = "2"

[workspace.lints.rust]
unexpected_cfgs = { level = "allow" }

[workspace.lints.clippy]
all = "warn"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1
[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
