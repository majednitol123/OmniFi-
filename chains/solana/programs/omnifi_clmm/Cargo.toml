[package]
name = "omnifi_clmm"
version = "0.1.0"
description = "OmniFi Solana Native Concentrated Liquidity AMM Program"
license = "MIT OR Apache-2.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "omnifi_clmm"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { version = "0.32.1", features = ["init-if-needed"] }
anchor-spl = "0.32.1"
uint = { version = "0.10", default-features = false }

[lints]
workspace = true

