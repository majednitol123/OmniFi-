services:
  anvil:
    image: trufflesuite/ganache:latest
    container_name: omnifi-anvil
    ports:
      - '8545:8545'
    command: ["--chain.chainId=31337", "--server.host=0.0.0.0", "--server.port=8545"]
    healthcheck:
      test: ['CMD', 'node', '-e', 'require("http").get("http://localhost:8545", (r) => process.exit(0)).on("error", () => process.exit(1))']
      interval: 5s
      timeout: 3s
      retries: 5

  postgres:
    image: postgres:16-alpine
    container_name: omnifi-postgres
    environment:
      POSTGRES_USER: omnifi
      POSTGRES_PASSWORD: omnifi_dev_password
      POSTGRES_DB: omnifi_dev
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U omnifi -d omnifi_dev']
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: omnifi-redis
    ports:
      - '6379:6379'
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5

  quote-api:
    build:
      context: .
      dockerfile: services/quote-api/Dockerfile
    image: omnifi-quote-api:latest
    container_name: omnifi-quote-api
    ports:
      - '3001:3001'
    environment:
      NODE_ENV: production
      PORT: 3001
      HOST: 0.0.0.0
      DATABASE_URL: postgres://omnifi:omnifi_dev_password@postgres:5432/omnifi_dev
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:3001/health || exit 1']
      interval: 5s
      timeout: 3s
      retries: 5

  prometheus:
    image: prom/prometheus:v2.50.1
    container_name: omnifi-prometheus
    ports:
      - '9090:9090'
    volumes:
      - ./deployments/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deployments/monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - promdata:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    depends_on:
      - quote-api

  grafana:
    image: grafana/grafana:10.3.3
    container_name: omnifi-grafana
    ports:
      - '3002:3000'
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./deployments/monitoring/grafana-dashboard.json:/var/lib/grafana/dashboards/dashboard.json:ro
      - grafanadata:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  pgdata:
  redisdata:
  promdata:
  grafanadata:
